# Paths and settings for the photo-selection pipeline. Paths may use ~.

# Extracted Google Takeout tree (contains "Takeout/Google Photos/..." folders).
# Kept on F: (F:\photo takeout\extracted) because it is large; the pipeline never writes there.
takeout_dir: "/mnt/f/photo takeout/extracted"

# SQLite DB, thumbnails, embeddings, contact sheets. Kept on the WSL ext4 disk
# (fast, and SQLite locking is unreliable on /mnt/* drives). Gitignored.
work_dir: ~/photo-archive/work

# Worker processes for ingest (machine has 16 cores; leave some free).
workers: 14

# Long edge, in pixels, of stored thumbnails and of the image used for
# sharpness/exposure statistics.
thumb_size: 512
analysis_size: 1024

# Ranking stage (python -m photosel rank). Cheap to re-run; tune these.
# Anything left out uses the defaults in photosel/rank.py.
rank:
  min_megapixels: 3.0       # 8x10 print at 200 dpi needs 3.2 MP
  junk_threshold: 0.5       # summed CLIP probability of screenshot/document/slide/... labels
  junk_rescue: 9.3          # ... but keep it if LAION aesthetic + TOPIQ-IAA reaches this
  burst_seconds: 60
  burst_similarity: 0.93
  burst_extra_every: 25     # big bursts keep 1 + size // 25 distinct winners
  copy_similarity: 0.97     # near-identical at any time (resized copies, re-shares): keep one ...
  copy_dhash_bits: 6        # ... only if their pixel fingerprints also match (<= 6 of 64 bits differ)
  event_gap_hours: 3.0
  event_gap_km: 30.0
  weights:
    aesthetic: 1.0          # LAION aesthetic (CLIP)
    iaa: 0.5                # TOPIQ aesthetic (AVA)
    iqa: 0.7                # TOPIQ technical quality
    sharpness: 0.3
    named_people: 0.3       # tagged with a named person in Google Photos
    favorited: 2.0
    edited: 0.7             # you edited it in Google Photos
    junk: -1.0              # x summed junk probability (for photos rescued from exclusion)
    zs_artwork: -2.0        # x probability it is a photo of someone else's painting
    zs_pet: 0.5
    zs_people: 0.3
    zs_group: 0.3
    megapixels: 0.2         # prefer the full-resolution copy
  per_event_factor: 0.6
  max_per_event: 12
  min_composite: 1.0       # weaker event picks are dropped
  global_top_frac: 0.01
